<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GLADE</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lexend', 'Segoe UI', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Professional background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 25% 25%, rgba(0, 102, 204, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(0, 102, 204, 0.03) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        .auth-container {
            background: #0f0f0f;
            border: 1px solid #333333;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 50px 40px;
            position: relative;
            overflow: hidden;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #0066cc;
        }

        h1 {
            color: #0066cc;
            margin-bottom: 10px;
            font-size: 2.2em;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #cccccc;
            margin-bottom: 35px;
            font-size: 1rem;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #ffffff;
            font-weight: 500;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #333333;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Lexend', sans-serif;
            transition: all 0.3s ease;
            background: #1a1a1a;
            color: #ffffff;
        }

        input:focus {
            outline: none;
            border-color: #0066cc;
            background: #0f0f0f;
        }

        input::placeholder {
            color: #666666;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Lexend', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #0066cc;
            color: #0a0a0a;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(0, 102, 204, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 102, 204, 0.3);
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 0.9rem;
        }

        a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        a:hover {
            color: #3399ff;
        }

        .toggle-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #333333;
        }

        .error {
            color: #ffffff;
            background: rgba(230, 57, 70, 0.1);
            border: 1px solid #e63946;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }

        .loading {
            display: none;
            text-align: center;
            color: #0066cc;
            margin-top: 15px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .auth-container {
                padding: 40px 30px;
                margin: 20px;
            }

            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to continue your journey</p>

        <div class="error" id="errorMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary">Login</button>
            <div class="loading" id="loading">Logging in...</div>
        </form>

        <div class="links">
            <a href="/password-reset">Forgot Password?</a>
            <a href="/signup">Create Account</a>
        </div>

        <div class="toggle-link">
            <a href="/welcome">Continue as Guest</a>
        </div>
    </div>

    <script type="module">
        import { auth } from '/static/firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        console.log('Login page loaded');
        console.log('Auth object:', auth);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('errorMsg');

            console.log('Login attempt:', email);

            errorDiv.style.display = 'none';
            loading.style.display = 'block';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                console.log('Login successful:', user.uid);

                localStorage.setItem('user', JSON.stringify({
                    uid: user.uid,
                    email: user.email
                }));

                window.location.href = '/dashboard';

            } catch (error) {
                console.error('Error:', error.code);
                
                let errorMsg = error.message;
                if (error.code === 'auth/user-not-found') {
                    errorMsg = 'User not found';
                } else if (error.code === 'auth/wrong-password') {
                    errorMsg = 'Wrong password';
                }
                
                errorDiv.textContent = errorMsg;
                errorDiv.style.display = 'block';
                
            } finally {
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
