<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glade</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lexend', 'Segoe UI', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Professional background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 25% 25%, rgba(0, 102, 204, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(0, 102, 204, 0.03) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        .welcome-container {
            max-width: 700px;
            width: 100%;
        }

        .welcome-card {
            background: #0f0f0f;
            border: 1px solid #333333;
            border-radius: 25px;
            padding: 60px 50px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .welcome-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #0066cc;
        }

        h1 {
            font-size: 3.5rem;
            color: #0066cc;
            margin-bottom: 25px;
            background: #0a0a0a;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #cccccc;
            font-size: 1.2rem;
            margin-bottom: 45px;
            line-height: 1.7;
            font-weight: 300;
        }

        .features {
            text-align: left;
            margin: 45px 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .feature {
            padding: 25px;
            background: #1a1a1a;
            border: 1px solid #333333;
            border-left: 3px solid #0066cc;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .feature:hover {
            background: rgba(0, 102, 204, 0.05);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 102, 204, 0.1);
        }

        .feature-text {
            font-weight: 600;
            font-size: 1rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cta-buttons {
            display: flex;
            gap: 20px;
            margin-top: 45px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 18px 40px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Lexend', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #0066cc;
            color: #0a0a0a;
            flex: 1;
            min-width: 200px;
            box-shadow: 0 4px 15px rgba(0, 102, 204, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 102, 204, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #0066cc;
            border: 2px solid #0066cc;
            flex: 1;
            min-width: 200px;
        }

        .btn-secondary:hover {
            background: rgba(0, 102, 204, 0.1);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .welcome-card {
                padding: 40px 30px;
            }

            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .features {
                grid-template-columns: 1fr;
            }

            .cta-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="welcome-card">
            <h1>Welcome</h1>
            <p class="subtitle">Your personal AI executive function coach is ready to help you break down tasks into micro-wins.</p>

            <div class="features">
                <div class="feature">
                    <div class="feature-text">Smart Decomposition</div>
                </div>
                <div class="feature">
                    <div class="feature-text">Gamified Experience</div>
                </div>
                <div class="feature">
                    <div class="feature-text">Progress Tracking</div>
                </div>
                <div class="feature">
                    <div class="feature-text">Custom Themes</div>
                </div>
            </div>

            <div class="cta-buttons">
                <button class="btn btn-primary" onclick="goToDashboard()">Get Started</button>
                <button class="btn btn-secondary" onclick="goToLogin()">Login</button>
            </div>
        </div>
    </div>

    <script>
        function goToDashboard() {
            window.location.href = '/dashboard';
        }

        function goToLogin() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
