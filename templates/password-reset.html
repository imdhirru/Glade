<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Glade</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lexend', 'Segoe UI', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Professional background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 25% 25%, rgba(0, 245, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(0, 245, 255, 0.03) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        .auth-container {
            background: #0f0f0f;
            border: 1px solid #333333;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 50px 40px;
            position: relative;
            overflow: hidden;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00f5ff;
        }

        h1 {
            color: #00f5ff;
            margin-bottom: 10px;
            font-size: 2.2em;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #cccccc;
            margin-bottom: 35px;
            font-size: 1rem;
            font-weight: 300;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .step-indicator {
            text-align: center;
            color: #666666;
            font-size: 0.85rem;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #ffffff;
            font-weight: 500;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #333333;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Lexend', sans-serif;
            transition: all 0.3s ease;
            background: #1a1a1a;
            color: #ffffff;
        }

        input:focus {
            outline: none;
            border-color: #00f5ff;
            background: #0f0f0f;
        }

        input::placeholder {
            color: #666666;
        }

        .otp-input {
            font-size: 1.8rem;
            letter-spacing: 8px;
            text-align: center;
            font-weight: 600;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Lexend', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #00f5ff;
            color: #0a0a0a;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(0, 245, 255, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 245, 255, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #666666;
            border: 2px solid #333333;
            margin-top: 15px;
        }

        .btn-secondary:hover {
            background: #1a1a1a;
            border-color: #666666;
        }

        .success {
            color: #ffffff;
            background: rgba(45, 106, 79, 0.1);
            border: 1px solid #2d6a4f;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }

        .error {
            color: #ffffff;
            background: rgba(230, 57, 70, 0.1);
            border: 1px solid #e63946;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }

        .loading {
            display: none;
            text-align: center;
            color: #00f5ff;
            margin-top: 15px;
            font-weight: 500;
        }

        .timer {
            text-align: center;
            color: #e63946;
            font-weight: 600;
            margin-top: 15px;
            display: none;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .auth-container {
                padding: 40px 30px;
                margin: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .otp-input {
                font-size: 1.5rem;
                letter-spacing: 5px;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <h1>Reset Password</h1>

        <!-- STEP 1: Email -->
        <div id="step1" class="step active">
            <p class="subtitle">Enter your email to get OTP</p>
            <div class="step-indicator">Step 1 of 3</div>

            <div class="error" id="errorMsg1"></div>
            <div class="success" id="successMsg1"></div>

            <form id="emailForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <button type="submit" class="btn btn-primary">Send OTP</button>
                <div class="loading" id="loading1">Sending OTP...</div>
            </form>
        </div>

        <!-- STEP 2: OTP Verification -->
        <div id="step2" class="step">
            <p class="subtitle">Enter the 6-digit OTP from your email</p>
            <div class="step-indicator">Step 2 of 3</div>

            <div class="error" id="errorMsg2"></div>

            <form id="otpForm">
                <div class="form-group">
                    <label for="otp">6-Digit OTP</label>
                    <input type="text" id="otp" class="otp-input" placeholder="000000" maxlength="6" inputmode="numeric"
                        required>
                </div>

                <button type="submit" class="btn btn-primary">Verify OTP</button>
                <button type="button" class="btn btn-secondary" onclick="goBackStep1()">Back</button>
                <div class="loading" id="loading2">Verifying...</div>

                <div class="timer" id="timer"></div>
            </form>
        </div>

        <!-- STEP 3: Set New Password -->
        <div id="step3" class="step">
            <p class="subtitle">Set your new password</p>
            <div class="step-indicator">Step 3 of 3</div>

            <div class="error" id="errorMsg3"></div>
            <div class="success" id="successMsg3"></div>

            <form id="passwordForm">
                <div class="form-group">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" placeholder="Your current password" required>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="At least 6 characters" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="btn btn-primary">Reset Password</button>
                <div class="loading" id="loading3">Resetting password...</div>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth } from '/static/firebase-config.js';
        import { updatePassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        let resetEmail = '';
        let resetOTP = '';

        console.log('Password reset page loaded');

        // STEP 1: Generate OTP
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const loading = document.getElementById('loading1');
            const errorDiv = document.getElementById('errorMsg1');
            const successDiv = document.getElementById('successMsg1');

            console.log('Generating OTP for:', email);

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch('/api/auth/generate-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error);
                }

                console.log('OTP sent via email');
                resetEmail = email;

                successDiv.textContent = 'OTP sent to your email! Check your inbox.';
                successDiv.style.display = 'block';

                setTimeout(() => {
                    goToStep2();
                }, 1500);

            } catch (error) {
                console.error('Error:', error.message);
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';

            } finally {
                loading.style.display = 'none';
            }
        });

        // STEP 2: Verify OTP
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const otp = document.getElementById('otp').value;
            const loading = document.getElementById('loading2');
            const errorDiv = document.getElementById('errorMsg2');

            console.log('Verifying OTP');

            errorDiv.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch('/api/auth/verify-otp-for-reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: resetEmail,
                        otp: otp
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error);
                }

                console.log('OTP verified - proceeding to password reset');

                setTimeout(() => {
                    goToStep3();
                }, 1000);

            } catch (error) {
                console.error('Error:', error.message);
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';

            } finally {
                loading.style.display = 'none';
            }
        });

        // STEP 3: Set New Password
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const loading = document.getElementById('loading3');
            const errorDiv = document.getElementById('errorMsg3');
            const successDiv = document.getElementById('successMsg3');

            console.log('Resetting password');

            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }

            if (newPassword.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch('/api/auth/reset-password-with-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: resetEmail,
                        current_password: currentPassword,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to reset password');
                }

                console.log('Password reset successful');

                successDiv.textContent = 'Password reset successful! Redirecting to login...';
                successDiv.style.display = 'block';

                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);

            } catch (error) {
                console.error('Error:', error.message);
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';

            } finally {
                loading.style.display = 'none';
            }
        });


        // NAVIGATION
        window.goToStep2 = function () {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            window.scrollTo(0, 0);
        };

        window.goBackStep1 = function () {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
            window.scrollTo(0, 0);
        };

        window.goToStep3 = function () {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
            window.scrollTo(0, 0);
        };

        window.goBackStep2 = function () {
            document.getElementById('step3').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            window.scrollTo(0, 0);
        };
    </script>
</body>

</html>
